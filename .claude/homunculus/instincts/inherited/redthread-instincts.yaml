# Redthread Workflow Add New Research Module

## Action

Follow the add-new-research-module workflow:
1. Create or modify one or more new Python modules under src/redthread/research/ (e.g., gepa_phase.py, gepa_adapter.py, gepa_pareto.py, etc.)
2. Update or add corresponding test files under tests/ (e.g., test_gepa_phase0.py, test_gepa_adapter.py, test_gepa_pareto.py)
3. Update or create any necessary supporting files (e.g., models.py, workspace.py) to integrate the new module
4. Ensure ruff and mypy pass, and all relevant tests are green

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/redthread/research/*.py, tests/test_*.py

