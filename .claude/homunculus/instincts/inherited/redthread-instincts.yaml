# Redthread Workflow Add Or Update Research Dependency

## Action

Follow the add-or-update-research-dependency workflow:
1. Edit pyproject.toml to add or update the dependency under an [optional] group (e.g., [research-gepa])
2. Update uv.lock to reflect the new/updated dependency
3. Ensure that the dependency is imported lazily or optionally in the relevant research module
4. Verify that core installs do not require the optional dependency

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: pyproject.toml, uv.lock, src/redthread/research/*.py

